name: Execute Public Frog
on:
  workflow_dispatch:
    inputs:
      first_elements:
        description: 'Add Elements A Here, Separated by Equal Signs'
        required: true
        type: string
      second_elements:
        description: 'Add Elements B Here, Separated by Equal Signs'
        required: true
        type: string
jobs:
  run_script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Load Code
        uses: actions/checkout@v4
      - name: Config. Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add Replicate
        run: pip install replicate
      - name: Run Script
        env:
          input_elm1: ${{ github.event.inputs.first_elements }}
          input_elm2: ${{ github.event.inputs.second_elements }}
          private: "false"
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          
        run: python frog.py
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: simulation-results.csv
