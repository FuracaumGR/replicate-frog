name: Execute Private Frog
on:
  workflow_dispatch:
    inputs:
      link_dpaste:
        description: 'Add the link of your dpaste.org page, Separating the elements with Equal Signs, Separating Elements A and B with a Newline'
        required: true
        type: string
        
jobs:
  run_script:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    
    steps:
      - name: Load Code
        uses: actions/checkout@v4
      - name: Config. Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add Libraries
        run: pip install replicate requests
      - name: Run Script
        env:
          input_dpaste: ${{ github.event.inputs.link_dpaste }}
          private: "true"
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          
        run: python frog.py
        
      - name: Results
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: simulation-results.csv
          retention-days: 1

      - name: Delete .csv File After 2 Minutes
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          echo "The file "simulation-results.csv" is ready to download for 30 seconds."
          sleep 30
          gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID
          echo "The file "simulation-results.csv" was successfully deleted."
