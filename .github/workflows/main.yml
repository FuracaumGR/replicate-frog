name: Execute Frog
on:
  workflow_dispatch:
    inputs:
      first_elements:
        description: 'Add the First Elements Here, Separated by Newlines'
        required: true
        type: string
      second_elements:
        description: 'Add the Second Elements Here, Separated by Newlines'
        required: true
        type: string
jobs:
  run_script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Load Code
        uses: actions/checkout@v4
      - name: Config. Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add Playwright
        run: pip install playwright
      - name: Add Chromium
        run: playwright install chromium
      - name: Run Script
        env:
          input_elm1: ${{ github.event.inputs.first_elements }}
          input_elm2: ${{ github.event.inputs.second_elements }}
        run: python frog.py
